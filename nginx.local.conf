            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://employee_service;
        }

        # =====================
        # SALARY AUDIT LOG
        # =====================

        location /api/v1/salary-audit-logs {
            proxy_http_version 1.1;
