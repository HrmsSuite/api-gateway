            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }
        location /api/v1/internal/hierarchy/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-production-b41c.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-production-b41c.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }
        # Internal employee APIs
        location /api/v1/internal/employees/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-production-b41c.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-production-b41c.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }
        # =====================
        # ATTENDANCE SERVICE
        # =====================

        location /api/v1/leavepolicy/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-production-60cf.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-production-60cf.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
