events {
    worker_connections 1024;
}

http {
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    client_max_body_size 20M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream auth_service {
        server node-auth-service-latest.onrender.com:443;
    }

    upstream employee_service {
        server employee-service-latest-hlhe.onrender.com:443;
    }

    upstream attendance_service {
        server attendance-service-latest.onrender.com:443;
    }

    server {
        listen 8080;

        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # =====================
        # AUTH SERVICE
        # =====================
        location /api/v1/auth/ {
            proxy_ssl_server_name on;
            proxy_ssl_name node-auth-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host node-auth-service-latest.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://auth_service;
        }

        # =====================
        # EMPLOYEE SERVICE
        # =====================
        location /api/v1/employees/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-latest-hlhe.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-latest-hlhe.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }

        location /api/v1/teams/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-latest-hlhe.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-latest-hlhe.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }

        location /api/v1/shift/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-latest-hlhe.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-latest-hlhe.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }

        location /api/v1/designation {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-latest-hlhe.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-latest-hlhe.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }

        location /api/v1/department {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-latest-hlhe.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-latest-hlhe.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }
        # =====================
        # ATTENDANCE SERVICE
        # =====================

        location /api/v1/leavepolicy/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-latest.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://attendance_service;
        }

        location /api/v1/events/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-latest.onrender.com;
            proxy_pass https://attendance_service;
        }

        location /api/v1/leaverequest/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-latest.onrender.com;
            proxy_pass https://attendance_service;
        }

        location /api/v1/leavebalance/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-latest.onrender.com;
            proxy_pass https://attendance_service;
        }

        location /api/v1/attendance/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-latest.onrender.com;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-latest.onrender.com;
            proxy_pass https://attendance_service;
        }
        # =====================
        # DEFAULT
        # =====================
        location / {
            return 404 '{"error":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}