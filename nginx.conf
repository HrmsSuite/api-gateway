events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;

        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        location /api/v1/auth/ {
            proxy_pass http://node-auth-svc:8000/api/v1/auth/;
        }

        location /api/v1/employees/ {
            proxy_pass http://employee-svc:8001/api/v1/employees/;
        }

 location /api/v1/designation {
            proxy_pass http://employee-svc:8001/api/v1/designation;
        }
        location /api/v1/department {
            proxy_pass http://employee-svc:8001/api/v1/department;
        }

        location / {
            return 404 '{"error":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}