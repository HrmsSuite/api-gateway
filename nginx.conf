            proxy_pass https://attendance_service;
        }

        location /api/v1/leavebalance/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-production-60cf.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-production-60cf.up.railway.app;
            proxy_pass https://attendance_service;
        }

        location /api/v1/attendance/ {
            proxy_ssl_server_name on;
            proxy_ssl_name attendance-service-production-60cf.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host attendance-service-production-60cf.up.railway.app;
            proxy_pass https://attendance_service;
        }
        # =====================
        # DEFAULT
        # =====================
        location / {
            return 404 '{"error":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}