events {
    worker_connections 1024;
}

http {
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    client_max_body_size 20M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream auth_service {
        server zippy-victory-production-8f30.up.railway.app:443;
    }

    upstream employee_service {
        server employee-service-production-b41c.up.railway.app:443;
    }

    upstream attendance_service {
        server attendance-service-production-60cf.up.railway.app:443;
    }

    server {
        listen 8080;
        
        location /health {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # =====================
        # AUTH SERVICE
        # =====================
        location /api/v1/auth/ {
            proxy_ssl_server_name on;
            proxy_ssl_name zippy-victory-production-8f30.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host zippy-victory-production-8f30.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://auth_service;
        }

        location /api/v1/auth/roles/ {
            proxy_ssl_server_name on;
            proxy_ssl_name zippy-victory-production-8f30.up.railway.app;
 
            proxy_http_version 1.1;
            proxy_set_header Connection "";
 
            proxy_set_header Host zippy-victory-production-8f30.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
 
            proxy_pass https://auth_service;
        }

        location /api/v1/auth/permissions/ {
            proxy_ssl_server_name on;
            proxy_ssl_name zippy-victory-production-8f30.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host zippy-victory-production-8f30.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://auth_service;
        }

        location /api/v1/auth/me/ {
            proxy_ssl_server_name on;
            proxy_ssl_name zippy-victory-production-8f30.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host zippy-victory-production-8f30.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://auth_service;
        }

        # =====================
        # EMPLOYEE SERVICE
        # =====================
        location /api/v1/employees/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-production-b41c.up.railway.app;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host employee-service-production-b41c.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass https://employee_service;
        }

        location /api/v1/teams/ {
            proxy_ssl_server_name on;
            proxy_ssl_name employee-service-production-b41c.up.railway.app;

            proxy_http_version 1.1;
